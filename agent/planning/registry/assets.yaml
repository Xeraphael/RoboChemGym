    supported_actions: [pick, place, pour, shake]
  ErlenmeyerFlask:
    aliases: [flask, erlenmeyer_flask, 锥形瓶]
    category: container
    variants:
      default: protocols/example_protocol/scene.usd
      solid: protocols/example_protocol/scene.usd
      liquid: protocols/example_protocol/scene.usd
    variant_property: content_phase
    supported_actions: [pick, place, pour, shake]
    required_anchors:
      pick: [grisp_position]
    variant_action_defaults:
      solid:
        pick:
          orientation_profile: pick_solid
          gripper_distance: 0.012
        place:
          orientation_profile: default
          place_offset_z: 0.12
      liquid:
        pick:
          orientation_profile: default
          gripper_distance: 0.008
        pour:
          orientation_profile: pour_default
          pour_speed: -1.0
        place:
          orientation_profile: default
          place_offset_z: 0.08
  FlatBottomFlask:
    aliases: [flat_bottom_flask, 平底烧瓶]
