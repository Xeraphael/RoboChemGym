    arxiv: https://arxiv.org/abs/2610.02708
    identifier: arXiv:2610.02708
  description: Use an electronic balance to weigh sodium acetate (4.1 g, 0.05 mol)
    from the wide-mouth bottle, transfer the weighed sodium acetate into a dry Erlenmeyer
    flask, then add anhydrous ethanol (25 mL, 0.43 mol) from the narrow-mouth bottle
    to the flask. Place the flask on a heating magnetic stirrer, press the button
    to start stirring and heating to gradually dissolve the solid. After the solution
    becomes clear, slowly add concentrated hydrochloric acid (approximately 0.5 mL)
    to adjust the reaction environment, and continue stirring at constant temperature
    for 10 min.
